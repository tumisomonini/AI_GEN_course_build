<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals</title>
  <link rel="stylesheet" href="Css/style.css">
  <link rel="stylesheet" href="Css/Approvals.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <h1>🎓 AI Course Builder</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="Syllabus.html">Syllabus</a>
        <a href="approvals.html" class="active">Approvals</a>
        <a href="exports.html">Exports</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h2>Course Approvals</h2>
        <button class="btn btn-secondary" onclick="loadApprovals()">↻ Refresh</button>
      </div>

      <div class="search-filter">
        <div class="filter-group">
          <label for="approval-status-filter">Status:</label>
          <select id="approval-status-filter">
            <option value="all">All</option>
            <option value="awaiting_approval">Awaiting Approval</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
          </select>
        </div>
      </div>

      <div class="approvals-list" id="approvals-container">
        <div class="empty-state"><p>Loading approvals…</p></div>
      </div>
    </div>
  </main>

  <!-- Review Modal -->
  <div id="approval-modal" class="modal">
    <div class="modal-content" style="max-width:640px;">
      <div class="modal-header">
        <h2 id="approval-modal-title">Review Course</h2>
        <button class="close" id="approval-cancel-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="approval-content"></div>
        <div class="form-group">
          <label for="approval-comments">Comments (optional)</label>
          <textarea id="approval-comments" rows="3" placeholder="Add reviewer notes…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger btn-sm" id="reject-btn">✗ Reject</button>
        <button class="btn btn-success" id="approval-submit-btn">✓ Approve & Generate</button>
      </div>
    </div>
  </div>

  <footer><div class="container"><p>&copy; 2026 Agentic Course Generation Platform</p></div></footer>

  <script src="JS/api.js"></script>
  <script src="JS/Approvals.js"></script>
</body>
</html>

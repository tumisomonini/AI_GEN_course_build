<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approvals</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/approvals.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>Approvals</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="syllabus.html">Generate Syllabus</a>
                <a href="approvals.html" class="active">Approvals</a>
                <a href="exports.html">Exports</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h2>Pending Approvals</h2>
            </div>

            <div class="approval-filters">
                <div class="filter-group">
                    <label for="approval-status-filter">Status:</label>
                    <select id="approval-status-filter">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="approval-course-filter">Course:</label>
                    <select id="approval-course-filter">
                        <option value="all">All Courses</option>
                        <!-- Courses will be loaded here -->
                    </select>
                </div>
            </div>

            <div class="approvals-list" id="approvals-container">
                <!-- Approvals will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Approval Modal -->
    <div id="approval-modal" class="modal">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2 id="approval-modal-title">Review Chapter</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="approval-content"></div>
                <form id="approval-form">
                    <div class="form-group">
                        <label for="approval-status">Status</label>
                        <select id="approval-status">
                            <option value="approved">Approve</option>
                            <option value="rejected">Reject</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="approval-comments">Comments</label>
                        <textarea id="approval-comments" rows="4"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="approval-cancel-btn">Cancel</button>
                <button type="button" class="btn btn-primary" id="approval-submit-btn">Submit</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Agentic Course Generation Platform</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/approvals.js"></script>
</body>
</html>

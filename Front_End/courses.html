<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Management</title>
  <link rel="stylesheet" href="Css/style.css">
  <link rel="stylesheet" href="Css/courses.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <h1>🎓 AI Course Builder</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="courses.html" class="active">Courses</a>
        <a href="Syllabus.html">Syllabus</a>
        <a href="approvals.html">Approvals</a>
        <a href="exports.html">Exports</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h2>Manage Courses</h2>
        <button id="create-course-btn" class="btn btn-primary">+ New Course</button>
      </div>

      <div class="search-filter">
        <input type="text" id="course-search" placeholder="Search courses…">
        <select id="course-status-filter">
          <option value="all">All Statuses</option>
          <option value="draft">Draft</option>
          <option value="generating_outline">Generating Outline</option>
          <option value="awaiting_approval">Awaiting Approval</option>
          <option value="generating_full">Generating Full</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      <div class="courses-grid" id="courses-container"></div>
    </div>
  </main>

  <!-- Create / Generate Modal -->
  <div id="course-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Create New Course</h2>
        <button class="close" id="cancel-btn">&times;</button>
      </div>
      <form id="course-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="course-title">Course Title</label>
            <input type="text" id="course-title" placeholder="e.g. Python for Data Science" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="course-level">Level</label>
              <select id="course-level">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div class="form-group">
              <label for="course-duration">Duration (months)</label>
              <input type="number" id="course-duration" value="3" min="1" max="24">
            </div>
          </div>
          <div id="gen-log-section" style="display:none;">
            <label style="font-size:.875rem;font-weight:500;">Generation Log</label>
            <div class="log-stream" id="gen-log" style="margin-top:.4rem;"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-btn-footer" onclick="closeCreateModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-course-btn">🚀 Generate</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Approve / Review Modal -->
  <div id="approve-modal" class="modal">
    <div class="modal-content" style="max-width:600px;">
      <div class="modal-header">
        <h2 id="approve-modal-title">Review Course Outline</h2>
        <button class="close" id="approve-cancel-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="approve-content"></div>
        <div class="form-group" style="margin-top:1rem;">
          <label for="chapter-edits">Edit Chapters (one per line)</label>
          <textarea id="chapter-edits" rows="6" placeholder="Chapter titles, one per line…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="approve-cancel-btn-footer" onclick="closeApproveModal()">Cancel</button>
        <button class="btn btn-success" id="approve-submit-btn">✓ Approve & Generate</button>
      </div>
    </div>
  </div>

  <!-- Progress Modal -->
  <div id="progress-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Generation Progress</h2>
        <button class="close" id="close-progress-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="log-stream" id="progress-log"></div>
      </div>
    </div>
  </div>

  <footer><div class="container"><p>&copy; 2026 Agentic Course Generation Platform</p></div></footer>

  <script src="JS/api.js"></script>
  <script src="JS/courses.js"></script>
  <script>
    // Ensure legacy inline onclick handlers don't break modal close.
    function closeCreateModal() {
      const modal = document.getElementById('course-modal');
      if (modal) modal.style.display = 'none';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Course Review</title>
    <script src="components/session-manager.js" defer></script>
    <script src="components/live-logger.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .content { background: #f8f9fa; padding: 20px; margin: 15px 0; border-radius: 8px; }
        .markdown { white-space: pre-wrap; font-family: 'Courier New', monospace; }
        .log-entry { font-family: 'Fira Code', monospace; font-size: 0.85rem; }
        #agent-console { background: #1e1e1e; color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Generated Course Review</h1>
        
        <div id="agent-console" class="p-4 border rounded-xl mb-4 h-48 overflow-y-auto text-sm hidden" style="background: #1e1e1e; color: #e0e0e0;">
            <div class="text-slate-500 italic">Course review ready - live logs active</div>
        </div>
        <div id="loading" class="loading">
            <p>🔄 Loading generated course...</p>
        </div>
        
        <div id="content" style="display: none;">
            <div id="course-info"></div>
            <div id="course-content" class="content"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Wait for sessionManager
            await new Promise(r => setTimeout(r, 100));
            
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course_id') || window.sessionManager?.courseId;
            
            const consoleEl = document.getElementById('agent-console');
            if (courseId && consoleEl) {
                consoleEl.classList.remove('hidden');
                window.liveLogger.init(consoleEl, courseId);
            }
            
            if (!courseId) {
                document.getElementById('loading').innerHTML = '<p>❌ No course ID - <a href="/Pages/dashboard.html">go to dashboard</a></p>';
                return;
            }
            
            window.liveLogger.logSystem(`Reviewing course ${courseId}`, 'info');
            loadCourse(courseId);
        });

        async function loadCourse(courseId) {
            try {
                window.liveLogger.logSystem('Fetching course content...', 'info');
                const response = await fetch(`/course-review/${courseId}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                window.liveLogger.logSystem('Course loaded - ready for review', 'success');
                displayCourse(data);
            } catch (error) {
                window.liveLogger.logSystem(`Load error: ${error.message}`, 'error');
                document.getElementById('loading').innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }

        function displayCourse(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            // Course info
            const template = data.template || {};
            document.getElementById('course-info').innerHTML = `
                <h2>${template.title || 'Generated Course'}</h2>
                <p><strong>Level:</strong> ${template.level || 'N/A'}</p>
                <p><strong>Duration:</strong> ${template.duration_months || 'N/A'} months</p>
                <p><strong>Chapters:</strong> ${template.chapters?.length || 0}</p>
                <a href="/pages/course_review_interface.html?course_id=${window.sessionManager.courseId}" 
                   class="bg-blue-600 text-white px-4 py-2 rounded mt-4 inline-block">
                    🔄 Full Interactive Review →
                </a>
            `;
            
            // Course content
            let contentHtml = '';
            
            if (data.final_markdown) {
                contentHtml = `
                    <h3>📄 Complete Course Content</h3>
                    <div class="markdown">${data.final_markdown}</div>
                `;
            } else if (data.generated_content) {
                contentHtml = '<h3>📚 Generated Chapters</h3>';
                for (const [chapterTitle, content] of Object.entries(data.generated_content)) {
                    contentHtml += `
                        <div class="content">
                            <h4>${chapterTitle}</h4>
                            <div class="markdown">${content.theory_content || 'No content generated'}</div>
                        </div>
                    `;
                }
            } else {
                contentHtml = '<p>⚠️ No content generated yet - <button onclick="window.liveLogger.resume()" class="text-blue-600 underline">resume generation</button></p>';
            }
            
            document.getElementById('course-content').innerHTML = contentHtml;
        }
    </script>
</body>
</html>

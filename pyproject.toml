[tool.poetry]
name = "ai-gen-course-builder"
version = "0.1.0"
description = "AI Course Generation Platform"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = {version = "^2.9.2", extras = ["email"]}
alembic = "^1.16.2"
psycopg2-binary = "^2.9.10"
neo4j = "^5.28.0"
redis = "^5.3.1"
openai = "^1.51.2"
langchain = "^0.3.3"
langchain-community = "^0.3.2"
langchain-astradb = ">=0.2.0"
langgraph = "^0.2.52"
cassio = "^0.1.8"
langsmith = "^0.4.4"
httpx = {extras = ["http2"], version = "^0.27.0"}
tenacity = "^9.0.0"
playwright = "^1.48.0"
beautifulsoup4 = "^4.12.3"
pypdf = "^5.1.0"
python-docx = "^1.1.2"
tiktoken = "^0.7.0"
duckduckgo-search = "^6.3.5"
pandas = "^2.2.3"
networkx = "^3.5"
numpy = "^2.1.1"
scipy = "^1.16.0"
scikit-learn = "^1.5.2"
sentence-transformers = "^3.1.1"
python-dotenv = "^1.0.1"
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
unsloth = { version = "2024.9", extras = ["cuda"] }  # MPS compat via torch
transformers = "^4.45.2"
trl = "^0.12.0"
datasets = "^2.21.0"
bitsandbytes = "^0.44.1"
asyncio-throttle = "^1.0.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# Notes:
# - torch: Run `poetry add torch --source pytorch -E mps` post-install for Apple Silicon
# - Install browsers: `poetry run playwright install`
# - Neo4j driver pinned for 5.20 compat
# - LangChain 0.3.x stable branch


[tool:pytest]
testpaths = Application/Tests
pythonpath = .
addopts = -v --tb=short --import-mode=prepend --ignore=Application/Scripts/perf_test.py --ignore-glob=Application/Scripts/perf_*.py


norecursedirs = Application/Scripts
python_files = test_*.py


asyncio_mode = auto

env_files = .env
markers =
    integration: marks tests as integration tests that may require external services (deselect with '-m \"not integration\"')
    test_author_agent: author agent tests
    test_planner_agent: planner agent tests
